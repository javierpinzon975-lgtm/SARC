spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/proyecto_sarc_api?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql.init.mode: always
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  jackson.serialization.write-dates-as-timestamps: false
app.admin-password: ${ADMIN_PASSWORD:}
app.jwt.secret: ${JWT_SECRET}
app.recordatorios:
  mail-from: ${MAIL_FROM:}
  twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
  twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
  twilio-sms-from: ${TWILIO_SMS_FROM:}
  twilio-whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
app.cors.allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}"
server.port: 8080
